# netlify.toml — PETER-SOFT Panel de Zócalos
#
# ARQUITECTURA: sitio estático puro, SIN build step.
# Los links se cargan en runtime desde Google Sheets CSV (links-loader.js).
# Esto garantiza que el deploy NUNCA falle por dependencias externas.
#
# ¿Por qué se eliminó el build step?
#   - El script fetch_links.mjs requería Node 18+ con fetch nativo.
#   - Si SHEET_CSV_URL no estaba en las env vars de Netlify → build fallido.
#   - Ahora links-loader.js hace el fetch directamente en el navegador,
#     con caché localStorage + fallback a /links.json estático del repo.
#
# Para regenerar links.json manualmente (opcional):
#   node scripts/fetch_links.mjs   (requiere Node 18+)
#   Luego commitear links.json actualizado como fallback de emergencia.

[build]
  publish = "."
  command = ""
  # command vacío → override cualquier comando en la UI de Netlify → deploy instantáneo

# Cache-Control para links.json (fallback estático en el repo)
[[headers]]
  for = "/links.json"
  [headers.values]
    Cache-Control = "public, max-age=300, stale-while-revalidate=600"

# Sin caché agresivo para el cargador (sirve la versión más reciente siempre)
[[headers]]
  for = "/links-loader.js"
  [headers.values]
    Cache-Control = "public, max-age=3600"
